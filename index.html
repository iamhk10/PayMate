<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayMate — Coming Soon</title>
  <meta name="description" content="PayMate project is under process.">
  <style>
    :root {
      --bg1: #4f46e5; --bg2: #14b8a6; --card: rgba(255, 255, 255, .14); --ink: #ffffff; --muted: rgba(255, 255, 255, .85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      background-size: 200% 200%;
      animation: bgShift 12s ease infinite;
      display: grid; place-items: center;
      padding: 16px;
      min-height: 100vh;
    }
    .card {
      text-align: center; background: var(--card);
      border: 1px solid rgba(255, 255, 255, .25);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 24px; padding: 40px 28px; max-width: 420px; width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
      animation: fadeUp .8s ease both;
    }
    .emoji { font-size: 64px; display: inline-block; animation: bounce 1.6s ease-in-out infinite; }
    h1 { font-size: 2rem; margin: 14px 0 6px; letter-spacing: .3px; }
    .tag { color: var(--muted); font-size: 1rem; margin-bottom: 22px; }
    .status {
      display: inline-block; padding: 8px 16px; border-radius: 999px;
      background: rgba(255, 255, 255, .2); font-weight: 600; font-size: .9rem;
    }
    .bar { margin: 24px auto 0; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .25); overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: 40%; border-radius: 99px; background: #fff;
      animation: slide 1.6s ease-in-out infinite;
    }
    .dots span { display: inline-block; animation: blink 1.4s infinite both; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    footer { margin-top: 22px; font-size: .85rem; color: var(--muted); }

    @keyframes bgShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">🚧</div>
    <h1>PayMate</h1>
    <p class="tag">Split smart. Settle easy.</p>
    <span class="status">🛠️ Project under process<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>
    <div class="bar" aria-hidden="true"><i></i></div>
    <footer>Jaldi wapas aayenge! 🚀 &nbsp;•&nbsp; by ΣTΣЯПITY</footer>
  </main>
</body>
</html>
